      const rest = dy.rehab.length === 0 && dy.workout.length === 0;

      const wComp = (wi) => {
        let d = 0, t = 0;
        WEEKS[wi].days.forEach((dy, di) => {
          const e = [...dy.rehab, ...dy.workout];
          if (!e.length) return; t++;
          if (e.every((_, ei) => ck[`${wi}-${di}-${ei}`])) d++;

        return { d, t };

            </div>

            {/* Day selector */}
            <div style={{ display: 'flex', gap: 0, marginTop: 24, borderBottom: '1.5px solid ' + C.text }}>
              {wk.days.map((d, i) => {
                const sel = i === sd;
                const exs = [...d.rehab, ...d.workout];
                const dd = exs.length > 0 && exs.every((_, ei) => ck[`${sw}-${i}-${ei}`]);
                return (
                  <button key={i} onClick={() => setSd(i)} style={{
                    flex: 1, padding: '12px 0 10px', border: 'none',
                    background: sel ? C.text : 'transparent',
                    color: sel ? C.bg : (dd ? C.text : C.muted),
                    fontFamily: fonts.display, fontSize: '0.9rem', letterSpacing: '0.04em',
                    cursor: 'pointer', position: 'relative',
                    borderLeft: i > 0 ? '1px solid ' + C.rule : 'none',
                  }}>
                    {d.day.slice(0,2).toUpperCase()}
                    {dd && !sel && <span style={{ position: 'absolute', bottom: 4, left: '50%', transform: 'translateX(-50%)', width: 4, height: 4, background: C.text }}></span>}
                  </button>
                );
              })}
            </div>

            {/* Day title */}
            <div style={{ padding: '32px 0 0' }}>
              <div style={{ fontFamily: fonts.display, fontSize: 'clamp(2rem, 7vw, 3rem)', lineHeight: 0.9 }}>{dy.day.toUpperCase()}</div>
              <div style={{ fontSize: '0.65rem', color: C.muted, marginTop: 6, letterSpacing: '0.12em', textTransform: 'uppercase' }}>{dy.label}</div>
            </div>

            {rest ? (
              <div style={{ padding: '64px 0', textAlign: 'center' }}>
                <div style={{ fontFamily: fonts.display, fontSize: '2.5rem', lineHeight: 1, marginBottom: 8 }}>REST</div>
                <div style={{ fontSize: '0.7rem', color: C.muted }}>{dy.cardio}</div>
              </div>
            ) : (
              <>
                {/* Progress */}
                <div style={{ padding: '24px 0 20px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                    <span style={{ fontSize: '0.6rem', color: C.muted, letterSpacing: '0.15em', textTransform: 'uppercase' }}>{dn}/{tot} Complete</span>
                    <span style={{ fontFamily: fonts.display, fontSize: '1.1rem', lineHeight: 1 }}>{pct}%</span>
                  </div>
                  <div style={{ height: 4, background: C.rule }}>
                    <div style={{ height: 4, background: C.text, width: `${pct}%`, transition: 'width 0.3s ease' }}></div>
                  </div>
                </div>

                {/* Rehab */}
                {dy.rehab.length > 0 && (
                  <div style={{ paddingTop: 12 }}>
                    <div style={{
                      fontFamily: fonts.display, fontSize: '0.75rem', letterSpacing: '0.25em',
                      textTransform: 'uppercase', marginBottom: 4, paddingBottom: 8,
                    }}>Rehab</div>
                    {dy.rehab.map((ex, i) => <ExRow key={i} ex={ex} idx={i} label="R" />)}
                  </div>
                )}

                {/* Workout */}
                {dy.workout.length > 0 && (
                  <div style={{ paddingTop: 24 }}>
                    <div style={{
                      fontFamily: fonts.display, fontSize: '0.75rem', letterSpacing: '0.25em',
                      textTransform: 'uppercase', marginBottom: 4, paddingBottom: 8,
                    }}>Workout</div>
                    {dy.workout.map((ex, i) => <ExRow key={i} ex={ex} idx={dy.rehab.length + i} label="W" />)}
                  </div>
                )}

                {/* Cardio */}
                {dy.cardio && (
                  <div style={{ marginTop: 24, padding: '16px 0', borderTop: '1.5px solid ' + C.text }}>
                    <div style={{
                      fontFamily: fonts.display, fontSize: '0.7rem', letterSpacing: '0.2em',
                      textTransform: 'uppercase', marginBottom: 6,
                    }}>Cardio</div>
                    <div style={{ fontSize: '0.75rem', fontWeight: 500 }}>{dy.cardio}</div>
                  </div>
                )}
              </>
            )}

            {/* Pain notice */}
            <div style={{
              marginTop: 32, padding: '12px 0', borderTop: '1px solid ' + C.rule,
              fontSize: '0.6rem', color: C.muted, letterSpacing: '0.1em', textTransform: 'uppercase', lineHeight: 1.8,
            }}>
              Pain 1-3/10 = Proceed &middot; Sharp pain = Stop &middot; Ice after sessions (Wks 1-3)
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
